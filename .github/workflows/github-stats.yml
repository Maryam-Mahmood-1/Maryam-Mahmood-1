name: Update GitHub Stats

on:
  # Run once every hour at minute 17.
  schedule:
    - cron: "17 * * * *"

  # Allow manual runs from the Actions tab.
  workflow_dispatch:

  # Also run whenever this workflow file itself is changed.
  push:
    paths:
      - ".github/workflows/github-stats.yml"

permissions:
  contents: write

concurrency:
  group: github-profile-stats
  cancel-in-progress: true

jobs:
  generate-stats:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      # ----------------------------------------------------------
      # Main GitHub stats card
      # ----------------------------------------------------------
      - name: Generate GitHub stats
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: stats
          options: username=${{ github.repository_owner }}&show_icons=true&theme=gruvbox&hide_border=true
          path: profile/stats.svg
          token: ${{ secrets.GITHUB_TOKEN }}
          fail_on_error: true

      # ----------------------------------------------------------
      # Top languages card
      # ----------------------------------------------------------
      - name: Generate top languages
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: top-langs
          options: username=${{ github.repository_owner }}&layout=compact&theme=gruvbox&hide_border=true&langs_count=6
          path: profile/top-langs.svg
          token: ${{ secrets.GITHUB_TOKEN }}
          fail_on_error: true

      # ----------------------------------------------------------
      # GitHub streak card
      # ----------------------------------------------------------
      - name: Generate GitHub streak
        uses: DenverCoder1/github-readme-streak-stats@v1.7.0
        with:
          options: user=${{ github.repository_owner }}&theme=gruvbox&hide_border=true&timezone=Asia/Karachi&disable_animations=true
          path: profile/streak.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      # ----------------------------------------------------------
      # Commit generated SVG files only when something changed
      # ----------------------------------------------------------
      - name: Commit generated stats
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add profile/stats.svg
          git add profile/top-langs.svg
          git add profile/streak.svg

          if git diff --cached --quiet; then
            echo "No stats changes to commit."
          else
            git commit -m "Update GitHub profile stats"
            git push
          fi
