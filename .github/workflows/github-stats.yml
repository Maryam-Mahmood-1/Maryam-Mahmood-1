name: Update GitHub Stats

on:
  # Run every hour at minute 17
  schedule:
    - cron: "17 * * * *"

  # Allow manual execution
  workflow_dispatch:

  # Run when this workflow is edited
  push:
    paths:
      - ".github/workflows/github-stats.yml"

permissions:
  contents: write

# Prevent two stats workflows from trying to write at the same time
concurrency:
  group: github-profile-stats
  cancel-in-progress: true

jobs:
  generate-stats:
    runs-on: ubuntu-latest

    steps:
      # ----------------------------------------------------------
      # Checkout repository
      # ----------------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      # ----------------------------------------------------------
      # GitHub stats
      # ----------------------------------------------------------
      - name: Generate GitHub stats
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: stats
          options: username=${{ github.repository_owner }}&show_icons=true&theme=gruvbox&hide_border=true
          path: profile/stats.svg
          token: ${{ secrets.GITHUB_TOKEN }}
          fail_on_error: true

      # ----------------------------------------------------------
      # Top languages
      # ----------------------------------------------------------
      - name: Generate top languages
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: top-langs
          options: username=${{ github.repository_owner }}&layout=compact&theme=gruvbox&hide_border=true&langs_count=6
          path: profile/top-langs.svg
          token: ${{ secrets.GITHUB_TOKEN }}
          fail_on_error: true

      # ----------------------------------------------------------
      # GitHub streak
      # ----------------------------------------------------------
      - name: Generate GitHub streak
        uses: DenverCoder1/github-readme-streak-stats@v1.7.0
        with:
          options: user=${{ github.repository_owner }}&theme=gruvbox&hide_border=true&timezone=Asia/Karachi&disable_animations=true
          path: profile/streak.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      # ----------------------------------------------------------
      # Commit generated files
      # ----------------------------------------------------------
      - name: Commit generated stats
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add profile/stats.svg
          git add profile/top-langs.svg
          git add profile/streak.svg

          # Stop here when nothing changed
          if git diff --cached --quiet; then
            echo "No stats changes to commit."
            exit 0
          fi

          git commit -m "Update GitHub profile stats"

          # The remote may have changed while the cards were being generated.
          # Fetch those changes and replay our stats commit on top.
          git pull --rebase origin main

          git push origin main
